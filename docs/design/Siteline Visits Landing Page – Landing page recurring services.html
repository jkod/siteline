    <div id="__bundler_placeholder">Loading Siteline Visits — a report after every visit...</div>
    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading');
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = '';
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                '[bundle] resource failed to load:',
                e.target.tagName,
                String(e.target.src || e.target.href || ''),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById('__bundler_err') ||
              p.appendChild(document.createElement('div'));
            d.id = '__bundler_err';
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
          },
          true,
        );

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
          const templateEl = document.querySelector('script[type="__bundler/template"]');
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data');
            console.error(
              '[bundler] Missing script tags — manifestEl:',
              !!manifestEl,
              'templateEl:',
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
          const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '') ? window.origin : '*';
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === 'null' &&
                (window.origin === 'file://' || window.location.protocol === 'file:')) ||
              (/^file:/.test(e.origin) && window.origin === 'null')
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: 'text/html' });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET);
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll('iframe'))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener('message', function (e) {
            const d = e.data;
            if (!d || typeof d !== 'object' || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === 'string') {
                try {
                  e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET);
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === 'string' &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === 'string'
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window) return;
              if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays))
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus('Unpacking ' + uuids.length + ' assets...');

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip');
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      'DecompressionStream not available, asset ' + uuid + ' may not render',
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    'data:' +
                    entry.mime +
                    ';base64,' +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus('Rendering...');
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
          // bundler left live-fetched (an absolute x-import, a runtime dependency it
          // could not embed, an authored external script) keeps the pin it was
          // written with: that fetch is exactly what SRI protects. (A crossorigin
          // on a parent whose child carries the blob — <video crossorigin><source>
          // — is left alone too; the attribute is then the author's to drop.)
          template = template.replace(/<[a-z][^>]*>/gi, (tag) =>
            /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag)
              ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '')
              : tag,
          );

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
            ';</' +
            'script>';
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template = template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html');
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll('iframe'))) {
              const m = MARKER.exec(el.getAttribute('src') || '');
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === 'string') {
                mountPage(el, m[2] || '', text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement('script');
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;

i><li>No Siteline footer<\u002Fli><\u002Ful>\n<a href=\"#start\" style=\"margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 1.5px solid #1C1F26; text-decoration: none; font-weight: 700\">Talk to us<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 28px 0 0; text-align: center; color: #4A4F5A; font-size: 15px; line-height: 1.55\">Prices per month, excluding VAT. Clients are always free. Doing renovations too? <a href=\"#top\">See Siteline for renovation firms.<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TESTIMONIAL -->\n<section style=\"padding: 112px 24px\">\n<div style=\"max-width: 900px; margin: 0 auto; text-align: center\">\n<svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6\"><\u002Fpath><\u002Fsvg>\n<p style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.25; letter-spacing: -0.02em; margin: 20px 0 0\">[Quote from a pilot tutor about fewer \"how did it go?\" messages and calmer evenings.]<\u002Fp>\n<p style=\"margin: 24px 0 0; color: #4A4F5A; font-weight: 600\">[Tutor name] · [Subject, area]<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"padding: 112px 24px; background: #FFFFFF; border-top: 1px solid #ECE7DE\">\n<div style=\"max-width: 820px; margin: 0 auto\">\n<h2 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0\">Questions, answered.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-direction: column; border-top: 1px solid #ECE7DE\">\n<sc-for list=\"{{faqs}}\" as=\"f\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom: 1px solid #ECE7DE\">\n<button type=\"button\" aria-expanded=\"{{f.isOpen}}\" sc-camel-on-click=\"{{f.toggle}}\" style=\"width: 100%; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: none; border: none; padding: 20px 0; font: inherit; font-size: 19px; font-weight: 700; color: #1C1F26; text-align: left; cursor: pointer\">\n<span>{{f.q}}<\u002Fspan>\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1C1F26\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"{{f.iconStyle}}\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<sc-if value=\"{{f.isOpen}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin: 0; padding: 0 40px 24px 0; color: #4A4F5A; line-height: 1.6; font-size: 16px\">{{f.a}}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINAL CTA -->\n<section id=\"start\" style=\"padding: 24px\">\n<div style=\"max-width: 1200px; margin: 0 auto; border-radius: 36px; background: {{accent}}; color: #FFFFFF; padding: clamp(40px, 7vw, 96px) clamp(24px, 6vw, 80px); display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: space-between\">\n<div style=\"flex: 1 1 420px\">\n<h2 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(2.25rem, 5vw, 4rem); line-height: 1; letter-spacing: -0.035em; margin: 0\">Send your first report today.<\u002Fh2>\n<p style=\"margin: 18px 0 0; font-size: 18px; line-height: 1.5; color: #E4F4F0\">Free for your first 3 clients. Set up in five minutes.<\u002Fp>\n<\u002Fdiv>\n<form style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 10px\">\n<label for=\"email\" style=\"font-weight: 700; font-size: 14px\">Email<\u002Flabel>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<input id=\"email\" type=\"email\" placeholder=\"you@example.se\" style=\"flex: 1 1 220px; min-height: 56px; border-radius: 999px; border: none; padding: 0 22px; font: inherit; font-size: 16px; color: #1C1F26\">\n<button type=\"submit\" style=\"min-height: 56px; padding: 0 28px; border-radius: 999px; border: none; background: #1C1F26; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer\">Start free<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding: 56px 24px 40px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 14px; color: #4A4F5A\">\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\"><rect x=\"1\" y=\"1\" width=\"32\" height=\"32\" rx=\"10\" fill=\"#1C1F26\"><\u002Frect><path d=\"M8 21 L15 14 L19 18 L26 11\" stroke=\"#FAF8F4\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"26\" cy=\"11\" r=\"3\" fill=\"{{accent}}\" stroke=\"#FAF8F4\" stroke-width=\"1.5\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; color: #1C1F26\">Siteline<\u002Fspan>\n<span>· Made in Sweden<\u002Fspan>\n<\u002Fdiv>\n<nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<a href=\"#top\" style=\"text-decoration: none\">For renovation firms<\u002Fa>\n<a href=\"#pricing\" style=\"text-decoration: none\">Pricing<\u002Fa>\n<a href=\"#faq\" style=\"text-decoration: none\">FAQ<\u002Fa>\n<a href=\"#top\" style=\"text-decoration: none\">Privacy<\u002Fa>\n<a href=\"#top\" style=\"text-decoration: none\">Contact<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#127A69&quot;,&quot;options&quot;:[&quot;#127A69&quot;,&quot;#C2452B&quot;,&quot;#24477A&quot;,&quot;#1C1F26&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6800}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { uc: 'tutors', open: 0, slide: 0 };\n  }\n  componentDidMount() { this.startHero(); }\n  componentWillUnmount() { if (this.heroTimer) clearInterval(this.heroTimer); }\n  startHero() {\n    var self = this;\n    if (this.heroTimer) clearInterval(this.heroTimer);\n    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) return;\n    this.heroTimer = setInterval(function () {\n      self.setState(function (s) { return { slide: (s.slide + 1) % 3 }; });\n    }, 6000);\n  }\n  renderVals() {\n    var self = this;\n    var groups = [\n      { label: 'tutors', photo: 'tutor pointing at a maths book on a kitchen table', color: '#2A3A52', chipA: 'Report sent to Anna', chipB: 'Next: Thu 15:00' },\n      { label: 'gardeners', photo: 'gardener trimming a hedge in an autumn garden', color: '#2F4A3C', chipA: 'Extra work approved · 350 kr', chipB: 'Next: Thu 29 Oct' },\n      { label: 'home cleaners', photo: 'bright kitchen counter being wiped down', color: '#3A4650', chipA: 'Key back in place', chipB: 'Next: Thu 08:00' }\n    ];\n    var cur = this.state.slide;\n    var heroSlides = groups.map(function (g, i) {\n      return {\n        photo: g.photo,\n        style: 'position: absolute; inset: 0; transition: opacity 1s ease; opacity: ' + (i === cur ? '1' : '0') + '; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 18px, rgba(255,255,255,0) 18px 36px), ' + g.color + ';'\n      };\n    });\n    var heroDots = groups.map(function (g, i) {\n      var on = i === cur;\n      return {\n        label: 'Show ' + g.label,\n        pressed: on ? 'true' : 'false',\n        style: 'display: block; height: 10px; border-radius: 999px; transition: width 0.3s ease, background 0.3s ease; width: ' + (on ? '28px' : '10px') + '; background: ' + (on ? '#FFFFFF' : 'rgba(255,255,255,0.4)') + ';',\n        pick: function () { self.setState({ slide: i }); self.startHero(); }\n      };\n    });\n    var accent = this.props.accent ?? '#127A69';\n    var tabs = [\n      { id: 'tutors', label: 'Tutors' },\n      { id: 'gardeners', label: 'Gardeners' },\n      { id: 'cleaners', label: 'Home cleaners' },\n      { id: 'other', label: 'Other services' }\n    ];\n    var base = 'min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; ';\n    var ucTabs = tabs.map(function (t) {\n      var sel = self.state.uc === t.id;\n      return {\n        label: t.label,\n        selected: sel ? 'true' : 'false',\n        style: base + (sel ? 'background: #1C1F26; color: #FFFFFF; border: 1.5px solid #1C1F26;' : 'background: #FFFFFF; color: #1C1F26; border: 1.5px solid #DDD6CA;'),\n        pick: function () { self.setState({ uc: t.id }); }\n      };\n    });\n    var faqData = [\n      { q: 'Do my clients need an app?', a: 'No. Clients open reports from a link in a text message, in the browser. They can add it to their home screen if they like.' },\n      { q: 'Do children get messages?', a: 'No. For tutoring, reports go to the parent or guardian. Children never get accounts, links or messages, and photos stay off unless a parent agrees.' },\n      { q: 'How long does a report take?', a: 'Under a minute. Tick what you did from your template, add a photo or a sentence, and send. Or hold the button and talk, and check the written version before it goes out.' },\n      { q: 'Can clients move a visit?', a: 'They can ask. You accept or suggest another time, and the schedule updates for both of you.' },\n      { q: 'What does it cost?', a: 'Free for up to 3 clients. The Visits plan is 99 kr a month excluding VAT for up to 20 clients. Clients never pay.' },\n      { q: 'Can I cancel anytime?', a: 'Yes. No lock-in and no setup fees. Cancel from your settings and keep an export of your reports.' },\n      { q: 'Is it GDPR compliant?', a: 'Yes. Data is stored in the EU, each client sees only their own reports, and you can export or delete data at any time.' }\n    ];\n    var faqs = faqData.map(function (f, i) {\n      var isOpen = self.state.open === i;\n      return {\n        q: f.q, a: f.a, isOpen: isOpen,\n        iconStyle: 'flex-shrink: 0; transition: transform 0.2s; transform: rotate(' + (isOpen ? '45deg' : '0deg') + ');',\n        toggle: function () { self.setState({ open: isOpen ? -1 : i }); }\n      };\n    });\n    return {\n      accent: accent,\n      heroSlides: heroSlides,\n      heroDots: heroDots,\n      heroGroup: groups[cur].label,\n      heroChipA: groups[cur].chipA,\n      heroChipB: groups[cur].chipB,\n      heroTutor: cur === 0,\n      heroGarden: cur === 1,\n      heroClean: cur === 2,\n      ucTabs: ucTabs,\n      ucTutors: this.state.uc === 'tutors',\n      ucGardeners: this.state.uc === 'gardeners',\n      ucCleaners: this.state.uc === 'cleaners',\n      ucOther: this.state.uc === 'other',\n      faqs: faqs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
